<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاتصال — MONEYADO</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2c3853; --txt:#e7ecf5; --muted:#8a99b5;
          --accent:#3b82f6; --ok:#22c55e; --warn:#ef4444; --amber:#eab308; --chip:#243049; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; background:var(--bg);
         color:var(--txt); font-size:15px; line-height:1.6; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:19px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; font-size:14px; padding:4px 10px; border-radius:8px; }
  nav a:hover, nav a.active { color:var(--txt); background:var(--chip); }
  .userbox { display:flex; gap:10px; align-items:center; }
  .role-badge { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px;
                background:rgba(59,130,246,.15); color:var(--accent); border:1px solid var(--accent); }
  button { font-family:inherit; font-size:14px; padding:7px 12px; border-radius:8px;
           border:1px solid var(--line); background:transparent; color:var(--txt); cursor:pointer; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:17px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; margin-inline-end:8px; vertical-align:middle; }
  .big { font-size:16px; font-weight:700; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--chip); }
  .qrbox { direction:ltr; font-family:"Consolas",monospace; font-size:12px; background:var(--bg);
           border:1px solid var(--line); border-radius:8px; padding:10px; max-height:180px; overflow:auto;
           white-space:pre-wrap; word-break:break-all; }
  #noaccess { display:none; text-align:center; color:var(--muted); padding:64px 16px; font-size:16px; }
  body.no-access .wrap { display:none; } body.no-access #noaccess { display:block; }
  #msg { position:fixed; bottom:16px; inset-inline-start:16px; background:var(--card);
         border:1px solid var(--line); padding:10px 16px; border-radius:8px; display:none; z-index:9; }
</style>
</head>
<body>
<header>
  <div>
    <h1>الاتصال + صحة MONEYADO</h1>
    <nav>
      <a href="/attention">الانتباه</a>
      <a href="/transfers">سجل الحوالات</a>
      <a href="/connect" class="active">الاتصال</a>
      <a href="/">الرئيسية</a>
    </nav>
  </div>
  <div class="userbox">
    <span id="roleBadge" class="role-badge" style="display:none"></span>
    <span id="whoami" class="muted">…</span>
    <button id="logoutBtn" style="display:none">خروج</button>
  </div>
</header>

<div id="noaccess">هذه الشاشة للمدير فقط.<br>تواصل مع المسؤول.</div>
<div class="wrap">
  <!-- حالة اتصال واتساب -->
  <div class="card">
    <h2>اتصال واتساب</h2>
    <div><span id="waDot" class="dot"></span><span id="waState" class="big">…</span></div>
    <div class="muted" id="waMeta" style="margin-top:6px"></div>
  </div>

  <!-- QR (المدير فقط) -->
  <div class="card">
    <h2>رمز الربط (QR)</h2>
    <div id="qrArea" class="muted">…</div>
  </div>

  <!-- صحة MONEYADO -->
  <div class="card">
    <h2>صحة MONEYADO <span class="muted">(نافذة الأتمتة)</span></h2>
    <div><span id="mDot" class="dot"></span><span id="mState" class="big">…</span></div>
    <div class="muted" id="mDetail" style="margin-top:6px"></div>
  </div>
</div>
<div id="msg"></div>

<script>
const $ = (id) => document.getElementById(id);
let ROLE = null;
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function api(path){
  const r = await fetch("/api"+path,{credentials:"same-origin"});
  if(r.status===401){location.replace("/login");throw new Error(401);}
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadConnection(){
  let c; try{ c = await api("/connection"); }catch(e){ return; }
  const dot=$("waDot"), st=$("waState");
  if(!c.available){ dot.style.background="var(--amber)"; st.textContent="تعذّر الوصول لخدمة واتساب";
    $("waMeta").textContent="تأكّد أن خدمة واتساب (Node) تعمل."; }
  else if(c.loggedOut){ dot.style.background="var(--warn)"; st.textContent="مسجّل خروجًا (يلزم ربط)";
    $("waMeta").textContent="احذف الجلسة وأعد الربط عبر QR."; }
  else if(c.connected){ dot.style.background="var(--ok)"; st.textContent="متّصل ✓";
    $("waMeta").textContent = (c.botJid?("البوت: "+esc(c.botJid)):"") ; }
  else { dot.style.background="var(--warn)"; st.textContent="غير متّصل";
    $("waMeta").textContent="بانتظار الاتصال/الربط."; }
}

async function loadQr(){
  let q; try{ q = await api("/connection/qr"); }catch(e){ $("qrArea").textContent="—"; return; }
  if(!q.available){ $("qrArea").innerHTML='<span class="muted">تعذّر الوصول لخدمة واتساب.</span>'; return; }
  if(q.connected){ $("qrArea").innerHTML='<span class="pill" style="color:var(--ok)">متّصل — لا حاجة لرمز ربط</span>'; return; }
  if(q.qr){
    $("qrArea").innerHTML = '<div class="muted" style="margin-bottom:8px">امسح رمز QR المعروض في طرفية خدمة واتساب لإتمام الربط. سلسلة الربط أدناه للمرجع:</div>'
      + '<div class="qrbox">'+esc(q.qr)+'</div>';
  } else {
    $("qrArea").innerHTML='<span class="muted">لا يوجد رمز ربط حاليًا (متّصل أو لم يُطلب بعد).</span>';
  }
}

async function loadMoneyado(){
  let m; try{ m = await api("/moneyado/health"); }catch(e){ return; }
  const map={ visible:["var(--ok)","يعمل والنافذة مرئية"], not_visible:["var(--warn)","مشغّل لكن النافذة غير مرئية"],
    not_running:["var(--warn)","غير مشغّل"], unknown_visibility:["var(--amber)","مشغّل (تعذّر فحص الرؤية)"],
    unavailable:["var(--amber)","غير متاح للفحص"] };
  const [color,label]=map[m.state]||["var(--muted)",m.state];
  $("mDot").style.background=color; $("mState").textContent=label;
  $("mDetail").textContent=(m.detail||"")+(m.pid?(" · PID "+m.pid):"");
}

function refresh(){ loadConnection(); loadQr(); loadMoneyado(); }

const ROLE_AR={manager:"مدير",reviewer:"مراجع",data_entry:"مُدخل بيانات"};
$("logoutBtn").onclick=async()=>{try{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"});}catch(e){}location.replace("/login");};
async function boot(){
  let me; try{ const r=await fetch("/api/auth/me",{credentials:"same-origin"}); if(!r.ok){location.replace("/login");return;} me=await r.json(); }
  catch(e){ location.replace("/login"); return; }
  ROLE=me.role; $("whoami").textContent=me.username;
  const rb=$("roleBadge"); rb.textContent=ROLE_AR[ROLE]||ROLE; rb.style.display="inline-block";
  $("logoutBtn").style.display="inline-block";
  if(ROLE!=="manager"){ document.body.classList.add("no-access"); return; }  // QR/الاتصال للمدير فقط
  refresh(); setInterval(refresh,5000);
}
boot();
</script>
</body>
</html>
