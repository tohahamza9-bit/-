<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكيانات الموحّدة — MONEYADO</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2c3853; --txt:#e7ecf5; --muted:#8a99b5;
          --accent:#3b82f6; --ok:#22c55e; --warn:#ef4444; --chip:#243049; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; background:var(--bg);
         color:var(--txt); font-size:15px; line-height:1.6; }
  header { padding:16px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; }
  a.back { color:var(--muted); text-decoration:none; font-size:14px; }
  a.back:hover { color:var(--txt); }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  .muted { color:var(--muted); font-size:13px; }
  input, select, button { font-family:inherit; font-size:14px; padding:8px 10px; border-radius:8px;
                  border:1px solid var(--line); background:var(--bg); color:var(--txt); }
  button { cursor:pointer; }
  button.ghost { background:transparent; }
  button.danger { color:var(--warn); border-color:var(--warn); }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; }
  tr.inactive { opacity:.5; }
  .pill { font-size:12px; font-weight:700; padding:1px 9px; border-radius:999px; }
  .pill.on { background:rgba(34,197,94,.15); color:var(--ok); }
  .pill.off { background:rgba(239,68,68,.15); color:var(--warn); }
  .addbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--card);
            border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .addbar input, .addbar select { min-width:120px; }
  #msg { position:fixed; bottom:16px; inset-inline-start:16px; background:var(--card);
         border:1px solid var(--line); padding:10px 16px; border-radius:8px; display:none; z-index:9; }
  .role-badge { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px;
                background:rgba(59,130,246,.15); color:var(--accent); border:1px solid var(--accent); }
  .userbox { display:flex; gap:10px; align-items:center; }
  #noaccess { display:none; text-align:center; padding:64px 16px; color:var(--muted); font-size:16px; }
  body.no-access .wrap { display:none; }
  body.no-access #noaccess { display:block; }
</style>
</head>
<body>
<header>
  <div>
    <h1>الكيانات الموحّدة</h1>
    <a class="back" href="/">→ لوحة التحكّم</a>
  </div>
  <div class="userbox">
    <span id="roleBadge" class="role-badge" style="display:none"></span>
    <span id="whoami" class="muted">…</span>
    <button id="logoutBtn" class="ghost" style="display:none">خروج</button>
  </div>
</header>

<div id="noaccess">لا صلاحية لعرض هذه الشاشة بحسابك الحالي.</div>

<div class="wrap">
  <p class="muted">طبقة كيانات للتسعير (حيّ→مدينة، خطأ إملائيّ/اختصار→اسم معياريّ). مستقلّة تمامًا عن
    إملاءات الخزائن/الموردين. عند الغموض (اسم يطابق أكثر من معياريّ) لا تخمين.</p>

  <div class="addbar" id="addbar" style="display:none">
    <input id="f_alias" placeholder="النصّ (alias)">
    <select id="f_type">
      <option value="city">مدينة</option>
      <option value="district">حيّ</option>
      <option value="service">خدمة/قناة</option>
      <option value="bank">بنك</option>
      <option value="wallet">محفظة</option>
      <option value="treasury">خزينة</option>
      <option value="supplier">مورد</option>
    </select>
    <input id="f_canon" placeholder="الاسم المعياريّ">
    <select id="f_conf">
      <option value="high">ثقة عالية</option>
      <option value="medium">متوسّطة</option>
      <option value="low">منخفضة</option>
    </select>
    <button onclick="addAlias()">＋ إضافة/تعديل</button>
  </div>

  <input id="search" placeholder="🔎 بحث…" style="width:100%; margin-bottom:8px">
  <table>
    <thead><tr><th>النصّ</th><th>النوع</th><th>المعياريّ</th><th>الثقة</th><th>الحالة</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="muted" style="display:none; padding:24px 0; text-align:center">لا كيانات.</div>
</div>
<div id="msg"></div>

<script>
const $ = (id) => document.getElementById(id);
let ROLE = null;
const canWrite = () => ROLE === "manager";
const TYPE_AR = { city:"مدينة", district:"حيّ", service:"خدمة/قناة", bank:"بنك",
                  wallet:"محفظة", treasury:"خزينة", supplier:"مورد" };
const CONF_AR = { high:"عالية", medium:"متوسّطة", low:"منخفضة" };
let ROWS = [];

function toast(t){ const m=$("msg"); m.textContent=t; m.style.display="block";
  clearTimeout(window._tt); window._tt=setTimeout(()=>m.style.display="none",2500); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

async function api(path, method="GET", body=null){
  const opt={ method, headers:{}, credentials:"same-origin" };
  if (body){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const r=await fetch("/api"+path, opt);
  if (r.status===401){ location.replace("/login"); throw new Error(401); }
  if (!r.ok){ let d=""; try{ d=(await r.json()).detail; }catch(e){} toast("خطأ "+r.status+(d?": "+d:"")); throw new Error(r.status); }
  return r.status===204 ? null : r.json();
}

function render(){
  const q=($("search").value||"").trim().toLowerCase();
  const rows=ROWS.filter(r=>!q || (r.alias+" "+r.canonical_name+" "+(TYPE_AR[r.entity_type]||"")).toLowerCase().includes(q));
  $("empty").style.display=rows.length?"none":"block";
  $("tbody").innerHTML=rows.map(r=>`<tr class="${r.active?'':'inactive'}">
    <td>${esc(r.alias)}</td><td>${TYPE_AR[r.entity_type]||esc(r.entity_type)}</td>
    <td>${esc(r.canonical_name)}</td><td>${CONF_AR[r.confidence]||esc(r.confidence)}</td>
    <td><span class="pill ${r.active?'on':'off'}">${r.active?'فعّال':'موقوف'}</span></td>
    <td>${!canWrite()?'':(r.active
      ? `<button class="ghost danger" onclick="setActive('${esc(r.alias)}','${r.entity_type}',false)">إيقاف</button>`
      : `<button class="ghost" onclick="setActive('${esc(r.alias)}','${r.entity_type}',true)">تفعيل</button>`)}</td>
  </tr>`).join("");
}

async function load(){ try{ ROWS=await api("/entity-aliases"); render(); }catch(e){} }

async function addAlias(){
  const alias=$("f_alias").value.trim(), canon=$("f_canon").value.trim();
  if (!alias || !canon){ toast("النصّ والاسم المعياريّ مطلوبان"); return; }
  try{ await api("/entity-aliases","POST",{ alias, entity_type:$("f_type").value,
       canonical_name:canon, confidence:$("f_conf").value }); }catch(e){ return; }
  $("f_alias").value=""; $("f_canon").value=""; toast("تم ✓"); load();
}
async function setActive(alias, entity_type, active){
  try{ await api(`/entity-aliases/${active?'enable':'disable'}`,"POST",{ alias, entity_type }); }catch(e){ return; }
  toast(active?"فُعّل ✓":"أُوقف ✓"); load();
}
$("search").addEventListener("input", render);

const ROLE_AR = { manager:"مدير", reviewer:"مراجع", data_entry:"مُدخل بيانات" };
$("logoutBtn").onclick = async () => {
  try{ await fetch("/api/auth/logout",{ method:"POST", credentials:"same-origin" }); }catch(e){}
  location.replace("/login");
};
async function boot(){
  let me;
  try{ const r=await fetch("/api/auth/me",{ credentials:"same-origin" });
       if(!r.ok){ location.replace("/login"); return; } me=await r.json(); }
  catch(e){ location.replace("/login"); return; }
  ROLE=me.role; $("whoami").textContent=me.username;
  const rb=$("roleBadge"); rb.textContent=ROLE_AR[ROLE]||ROLE; rb.style.display="inline-block";
  $("logoutBtn").style.display="inline-block";
  if (ROLE==="data_entry"){ document.body.classList.add("no-access"); return; }
  if (canWrite()) $("addbar").style.display="flex";
  load();
}
boot();
</script>
</body>
</html>
